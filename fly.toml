# Fly.io config: https://fly.io/docs/reference/configuration/
# `fly launch --copy-config --no-deploy`, then `fly deploy`. Rooms live in memory, so run a
# single machine (`fly scale count 1`) and don't let Fly stop it while people are playing.
app = "fishbowl"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_PROXY = "1"
  # PUBLIC_URL = "https://fishbowl.example.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
